# ============================================================
# 通用客服平台 · 业务配置中心
# 原则:不改代码,只改这个 YAML,就能换一家公司的客服
# ============================================================

company:
  name: ABC科技
  industry: ecommerce            # ecommerce / game / saas / logistics / finance ...

customer_service:
  name: 小A客服
  language: zh-CN
  greeting: 您好,我是小A,请问有什么可以帮您?
  composer_placeholder: 输入你的问题,例如:我的订单到哪了?
  escalation_note: 如需人工服务,直接说"转人工"即可

# ---------------- 模型层 ----------------
# decision = Jev(大脑里的"判断器");chat = 话术生成模型(负责"把话说好"的人,不限定厂商)
# 两者是完全独立的槽位:各自的 provider / base_url / api_key 单独配置、互不影响。
#
# 每个槽位通过独立环境变量注入密钥(密钥不进仓库):
#   Jev : JEV_PROVIDER / JEV_BASE_URL / JEV_API_KEY / JEV_MODEL
#   Chat: CHAT_PROVIDER / CHAT_BASE_URL / CHAT_API_KEY / CHAT_MODEL
#     (chat 槽位不绑死厂商:Qwen / GPT / DeepSeek / 内部网关均可,只要是 OpenAI 兼容端点)
# 槽位未配 base_url/api_key 时服务拒绝启动——不做静默降级。
models:
  # Jev:意图识别 + 情绪 + 路由决策(小模型即可)
  decision:
    provider: ${JEV_PROVIDER:-openjev}
    model: ${JEV_MODEL:-jev-latest}
    base_url: ${JEV_BASE_URL:-https://api.typesafe.ai/v1/systemone}
    api_key: ${JEV_API_KEY:-}
    temperature: 0.1
    timeout_seconds: 20
  # chat:客服话术生成(大模型;厂商不限——此处为 MiniMax 的 OpenAI 兼容端点)
  chat:
    provider: ${CHAT_PROVIDER:-openai-compatible}
    model: ${CHAT_MODEL:-MiniMax-M3}
    base_url: ${CHAT_BASE_URL:-https://api.minimax.cn/v1}
    api_key: ${CHAT_API_KEY:-}
    temperature: 0.6
    timeout_seconds: 60
  # 会话标题生成(默认复用 chat 槽位的 CHAT_* 变量)
  title:
    provider: ${CHAT_PROVIDER:-openai-compatible}
    model: ${CHAT_MODEL:-qwen3.8-14b}
    base_url: ${CHAT_BASE_URL:-}
    api_key: ${CHAT_API_KEY:-}

# ---------------- 知识库(RAG = 公司知识库) ----------------
knowledge:
  enabled: true
  vector_store: memory           # memory = 纯 Python 零依赖 | chroma(预留)
  top_k: 3
  score_threshold: 0.05

# ---------------- 侧栏面板(前端按配置动态渲染) ----------------
panels:
  - id: overview
    label: 概览
  - id: orders
    label: 订单
  - id: tickets
    label: 工单

# ---------------- 启用的工具(插件式,换行业只换这个列表) ----------------
# 当前数据面(见 mcp 段)暴露 客户/订单/商品 查询;
# 退款/取消/建工单上游尚未暴露 MCP 工具,相应意图路由到转人工(见 intents)。
tools:
  - search_customer
  - get_order
  - get_product
  - query_knowledge
  - transfer_to_human

# ---------------- 意图目录(Jev 的判断范围) ----------------
# action = 该意图命中的工具名;none = 直接对话,不调工具
# agent = 该意图默认调度的专职 AGENT(Jev 可直接指定 agent,未指定时按这里兜底)
intents:
  greet:
    action: none
    agent: chat_agent
    description: 打招呼/寒暄
    keywords: [你好, 您好, 在吗, hi, hello, 在不在, 嗨]
  customer_identify:
    action: search_customer
    agent: chat_agent
    description: 客户表明身份(姓名/手机号/客户ID),先检索确认身份
    keywords: [我是, 手机号, 姓名, 查客户, 账号]
  order_query:
    action: get_order
    agent: order_agent
    description: 查询订单状态/物流进度
    keywords: [订单, 发货, 物流, 快递, 到哪, 多久到, 还没到, 配送, 签收]
  refund_request:
    action: transfer_to_human
    agent: aftersale_agent
    description: 申请退款/退货(上游未暴露退款工具,转人工办理)
    keywords: [退款, 退钱, 退货, 退掉, 把钱退, 退回]
  cancel_order:
    action: transfer_to_human
    agent: aftersale_agent
    description: 取消订单(上游未暴露取消工具,转人工办理)
    keywords: [取消订单, 取消, 不想要了, 撤单]
  product_query:
    action: get_product
    agent: product_agent
    description: 咨询商品/产品信息(价格/规格/库存)
    keywords: [产品, 商品, 多少钱, 价格, 规格, 参数, 有货, 库存, 优惠]
  knowledge_query:
    action: query_knowledge
    agent: knowledge_agent
    description: 咨询通用问题/政策/售后规则(走 RAG 知识库)
    keywords: [怎么, 如何, 政策, 规则, 保修, 保质期, 运费, 发票, 积分, 会员]
  ticket_create:
    action: transfer_to_human
    agent: aftersale_agent
    description: 投诉/报修(上游未暴露工单工具,转人工登记)
    keywords: [投诉, 工单, 报修, 坏了, 质量问题, 举报, 维权]
  human_request:
    action: transfer_to_human
    agent: chat_agent
    description: 要求转人工客服
    keywords: [人工, 人工客服, 找人, 电话客服, 真人, 活人]
  garbage:
    action: none
    agent: chat_agent
    description: 垃圾信息或与业务无关的内容(广告、骚扰、乱码、测试字符、无意义闲聊),直接友好回复,不调工具也不过生成模型
    keywords: [广告, 骚扰, 乱码, 测试, 无关, 刷屏]
    # 固化直回文案(支持 {agent_name}/{company_name} 占位符);配了就走直通通道
    direct_reply: |
      您好,我是{agent_name},只能为您解答订单、商品、售后相关的问题。如需帮助,请直接描述您的问题,我会尽快为您处理。
  fallback:
    action: none
    agent: chat_agent
    description: 无法识别,礼貌追问

# ---------------- 专职 AGENT 目录(AI CHAT 出口内部,由 Jev 调度) ----------------
# 每个 AGENT = 人设提示词(instructions)+ 可用工具 + 是否查知识库。
# Jev 按用户意图选择最合适的 AGENT;新增/调整 AGENT 只改这里,代码不动。
# instructions 支持占位符:{agent_name}(客服名)、{company_name}(公司名)。
agents:
  default: chat_agent                # Jev 无法判断时的兜底 AGENT
  chat_agent:
    title: 通用客服
    description: 寒暄接待、身份确认、无法归类的一般性问题
    instructions: |
      你是{agent_name},{company_name}的通用客服。负责日常接待与一般性问题:
      - 语气亲切简洁,先确认客户需求再行动;
      - 客户表明身份时,引导提供手机号或客户ID以便核实;
      - 不确定的问题不要编造,建议客户转人工。
    tools: [search_customer]
    needs_rag: false
  order_agent:
    title: 订单客服
    description: 订单状态、物流进度、履约信息查询
    instructions: |
      你是{agent_name},{company_name}的订单客服。处理订单与物流相关咨询:
      - 基于已查证信息中的订单数据回答,突出订单号、状态、金额、时间;
      - 物流进度要说明当前环节与预计时间,没有数据就说"暂未查询到";
      - 客户要改地址/取消/退款等变更操作时,说明需转人工办理并引导转接。
    tools: [get_order, search_customer]
    needs_rag: false
  product_agent:
    title: 商品顾问
    description: 商品信息、价格、库存、规格咨询
    instructions: |
      你是{agent_name},{company_name}的商品顾问。回答商品相关咨询:
      - 基于已查证信息中的商品数据回答,突出名称、价格(如有)、销售状态;
      - 库存/规格以查询结果为准,不承诺没有查到的信息;
      - 可适当补充商品的一般性卖点,但不得虚构参数。
    tools: [get_product]
    needs_rag: false
  knowledge_agent:
    title: 知识库客服
    description: 退款政策、发票、保修、运费、会员规则等通用问题解答
    instructions: |
      你是{agent_name},{company_name}的知识库客服。依据公司知识库回答通用规则问题:
      - 只根据「已查证信息」中的知识库段落作答,并说明依据;
      - 知识库没有覆盖的问题,明确告知"需要确认"并建议转人工,严禁编造政策;
      - 回答分段清晰,涉及数字(天数/比例/金额)务必与知识库一致。
    tools: [query_knowledge]
    needs_rag: true
  aftersale_agent:
    title: 售后客服
    description: 退款/取消/投诉等售后诉求(当前转人工办理)
    instructions: |
      你是{agent_name},{company_name}的售后客服。处理退款、取消、投诉等售后诉求:
      - 先安抚客户情绪,确认诉求涉及的订单;
      - 当前售后变更操作由人工办理,清晰告知将为其转接人工客服;
      - 不要承诺具体退款到账时间,以人工客服答复为准。
    tools: []
    needs_rag: false

# ---------------- Jev 决策引擎参数(路由旋钮,全部可配) ----------------
jev:
  # 置信度分档:路由的核心旋钮
  #   >= high        :直接执行业务工具
  #   [low, high)    :执行业务工具,但提示生成模型回复需谨慎
  #   <  low         :不执行业务工具,改走 fallback_action
  confidence:
    high: 0.85
    low: 0.55
  # 低置信度时的兜底动作:query_knowledge(查知识库)| transfer_to_human | none
  fallback_action: query_knowledge
  # 情绪 → 路由覆盖(命中即改道,优先于业务动作;填 none 表示不改道)
  emotion_routing:
    angry: transfer_to_human        # 愤怒 → 直接转人工
    frustrated: transfer_to_human   # 沮丧 → 转人工
    anxious: none                   # 焦虑 → 不改道,由 Qwen 话术安抚
    happy: none
    normal: none
  # 模型调用重试(传输层失败时)
  retry:
    attempts: 2                     # 总尝试次数(含首次)
    backoff_seconds: 0.5            # 每次重试前等待秒数

# ---------------- 规则(安全/确认门槛) ----------------
rules:
  human_transfer:
    enabled: true
    queue_position: 1                 # 演示排队位;生产可接实时排队系统
    queue_estimate: "约 2 分钟"
  # 上游暴露退款/取消/工单工具后,取消下面注释并恢复 tools/intents 中的相应动作:
  # refund_order:
  #   require_confirmation: true
  #   confirmation_prompt: 确认要为订单 {order_id} 申请退款吗?退款将原路返回。
  # cancel_order:
  #   require_confirmation: true
  #   confirmation_prompt: 确认要取消订单 {order_id} 吗?

# ---------------- MCP 数据面 ----------------
# 平台不直连业务数据库:客户、订单、商品等数据全部通过内嵌 MCP Client
# 经 MCP 协议请求上游业务系统(CRM / 订单中心 / 商品中心 / 工单系统…)。
# 换上游系统 = 改 servers 连接信息 + tool_mapping 映射,平台代码不动。
mcp:
  servers:
    - name: upstream
      transport: http                    # http(Streamable HTTP)| stdio(子进程)
      url: ${UPSTREAM_MCP_URL:-http://127.0.0.1:9003/mcp}
      headers:
        # 上游 MCP 的鉴权头(头名与取值由上游约定,这里按实际修改)
        auth: ${UPSTREAM_MCP_TOKEN:-}
      timeout_seconds: 30
      # ---- stdio 传输示例(取消注释使用)----
      # transport: stdio
      # command: /path/to/upstream-mcp-server
      # args: []

  # 平台工具/数据读取 → 上游 MCP 工具映射
  # 映射格式:<servers 里的 name>.<上游工具名>;上游工具契约见其自己的文档
  tool_mapping:
    search_customer: upstream.search_customer
    get_customer: upstream.get_customer
    get_order: upstream.get_order
    list_orders: upstream.list_orders
    get_product: upstream.get_product
    # 可选:令牌换身份(已登录场景配了才启用 X-Customer-Token 请求头)
    # resolve_token: upstream.resolve_token

  # 画像缓存(秒):0 = 每次实时回源;短 TTL 避免面板频繁打爆上游
  profile_cache_seconds: 5
